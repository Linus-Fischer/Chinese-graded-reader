<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Graded Chinese Reader</title>
<style>
:root{--bg:#faf7f2;--fg:#2a2623;--mut:#7a716a;--card:#fff;--bd:#e4ddd3;--ac:#b8322a;--hl:#f6e3df;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1a19;--fg:#ece6df;--mut:#9b918a;--card:#262322;--bd:#3a3533;--ac:#e0675d;--hl:#3b2623;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1c1a19;--fg:#ece6df;--mut:#9b918a;--card:#262322;--bd:#3a3533;--ac:#e0675d;--hl:#3b2623;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5}
main{max-width:640px;margin:0 auto;padding:20px 16px 300px}
h1{font-size:22px;margin:0 0 4px}
.sub{color:var(--mut);font-size:14px;margin:0 0 16px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
button{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--fg);padding:7px 13px;border-radius:999px;cursor:pointer}
button.on{background:var(--ac);border-color:var(--ac);color:#fff}
.story{display:block;width:100%;text-align:left;border-radius:12px;padding:12px 14px;margin:8px 0}
.story b{display:block;font-size:17px}.story span{color:var(--mut);font-size:13px}
.sent{margin:0 0 16px}
.line{display:flex;flex-wrap:wrap;align-items:flex-end;gap:2px 1px}
.w{display:inline-flex;flex-direction:column;align-items:center;padding:2px 3px;border-radius:6px;cursor:pointer}
.w:hover,.w.sel{background:var(--hl)}
.py{font-size:12px;color:var(--mut);min-height:16px}
.hide-py .py{visibility:hidden}
.hz{font-size:26px;line-height:1.3;font-family:"Noto Serif SC","Songti SC",serif}
.p{font-size:26px;align-self:flex-end;font-family:"Noto Serif SC","Songti SC",serif}
.tr{color:var(--mut);font-size:14px;margin-top:2px;display:none}
.show-tr .tr{display:block}
#pop{max-height:60vh;overflow-y:auto;position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--bd);padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));display:none}
#pop .in{max-width:640px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:12px}
#pop .big{font-size:24px}#pop .pp{color:var(--ac)}
#strokes{display:flex;gap:8px;overflow-x:auto;max-width:640px;margin:0 auto 10px}#strokes:empty{display:none}.sc{flex:0 0 auto;min-width:90px;min-height:90px;border:1px solid var(--bd);border-radius:8px;font-size:12px;color:var(--mut);cursor:pointer;display:flex;align-items:center;justify-content:center;text-align:center;padding:4px;max-width:140px}
#cinfo{max-width:640px;margin:0 auto 10px;font-size:14px;line-height:1.45}#cinfo:empty{display:none}#cinfo div{padding:2px 0}
:root{--ok:#2e7d4f;--no:#b3261e}
header.top h1{font-size:28px;letter-spacing:.5px;margin:0}
.tabs{display:flex;gap:8px;margin:14px 0}
.prog{display:flex;align-items:center;gap:10px;margin:6px 0 14px;color:var(--mut);font-size:13px}
.bar{flex:1;height:6px;background:var(--bd);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}
.story{position:relative;border-left:4px solid var(--ac);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.story em{position:absolute;right:14px;top:14px;font-style:normal;font-size:12px;color:var(--ac);border:1px solid var(--ac);padding:1px 8px;border-radius:999px}
.cta{display:block;width:100%;margin:12px 0;padding:13px;border-radius:12px;background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600}
.cta.alt{background:var(--card);color:var(--fg);border-color:var(--bd)}
.opt{display:block;width:100%;text-align:left;margin:8px 0;padding:14px;border-radius:12px;font-size:16px}
.opt.ok{border-color:var(--ok);background:rgba(46,125,79,.18)}.opt.no{border-color:var(--no);background:rgba(179,38,30,.18)}
.fc{margin:16px 0;min-height:200px;border:1px solid var(--bd);background:var(--card);border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;cursor:pointer;text-align:center;padding:20px}
.hz2{font-size:64px}.py2{color:var(--ac);font-size:22px}
.score{font-size:64px;font-weight:700;color:var(--ac)}.score small{font-size:24px;color:var(--mut)}
.hz,.p{font-size:var(--hz,26px)}
.back{background:none;border:none;color:var(--ac);padding:0;margin-bottom:8px}
.saved{margin-top:24px;border-top:1px solid var(--bd);padding-top:12px;font-size:14px}
.saved div{padding:3px 0}
</style></head><body><main id="app"></main>
<div id="pop"><div id="strokes"></div><div id="cinfo"></div><div class="in"><div><span class="big" id="phz"></span> <span class="pp" id="ppy"></span><div id="pgl"></div></div><div class="row" style="margin:0;flex-wrap:nowrap"><button id="psave">+ Save</button><button id="pclose" aria-label="Close">✕</button></div></div></div>

"我|wǒ|I/不好意思|bù hǎoyìsi|embarrassed/地|de|(adverb marker)/走|zǒu|to walk/进|jìn|into/教室|jiàoshì|classroom/，/老师|lǎoshī|teacher/笑|xiào|to smile/着|zhe|(ongoing)/说|shuō|to say/没关系|méi guānxi|it’s okay/。=Embarrassed, I walked into the classroom; the teacher smiled and said it was okay.",

const QZ={
"我的家":[{q:"How many people are in the family?",o:["Three","Four","Five"],a:1},{q:"What is Dad’s job?",o:["Teacher","Doctor","Student"],a:1},{q:"What is the cat’s name?",o:["Mimi","Xiao Ming","Beijing"],a:0},{q:"What does the family do after the meal?",o:["Play outside","Watch TV","Go to sleep"],a:1}],
"在饭店":[{q:"Who does the narrator go with?",o:["Mom","A friend","A teacher"],a:1},{q:"What does the narrator want to eat?",o:["Fish","Rice","Noodles"],a:0},{q:"How many cups of water do they want?",o:["One","Two","Three"],a:1},{q:"How much is the bill?",o:["Fifteen yuan","Fifty yuan","Five yuan"],a:1}],
"快乐的星期六":[{q:"Which day of the week is the story about?",o:["Friday","Saturday","Sunday"],a:1},{q:"Who calls the narrator?",o:["Mom","Xiao Hong","A teacher"],a:1},{q:"What does the narrator buy at the shop?",o:["Apples","Tea","A book"],a:0},{q:"How much were the apples?",o:["Five yuan","Ten yuan","Fifty yuan"],a:0},{q:"What do they do in the afternoon?",o:["Watch a movie","Study","Play ball"],a:0},{q:"What does the narrator do at eight in the evening?",o:["Watch TV","Read a book","Cook dinner"],a:1}],
"我的一天":[{q:"What is the narrator’s name?",o:["Xiao Ming","Xiao Hong","Li Lei"],a:0},{q:"Where does the narrator go today?",o:["The hospital","School","Beijing"],a:1},{q:"When do they eat with friends?",o:["Morning","Noon","Night"],a:1}]};
const PKEY="graded-reader-progress";
function lp(){try{return JSON.parse(localStorage.getItem(PKEY))||{}}catch(e){return{}}}
let PR=lp();
function sp(){try{localStorage.setItem(PKEY,JSON.stringify(PR))}catch(e){}}
let fs=26;
function size(d){fs=Math.min(40,Math.max(18,fs+d));document.documentElement.style.setProperty("--hz",fs+"px")}
function markRead(){const p=PR[st.t]=PR[st.t]||{};p.read=1;sp()}
const KEY="graded-reader-saved";
function load(){try{return JSON.parse(localStorage.getItem(KEY))||[]}catch(e){return[]}}
function store(){try{localStorage.setItem(KEY,JSON.stringify(saved))}catch(e){}}
let lv="HSK 1",st=null,py=true,tr=false,cur=null,saved=load();
const $=id=>document.getElementById(id);
function parse(line){const[a,b]=line.split("=");return{tk:a.split("/").map(x=>{const p=x.split("|");return p.length<3?{p:x}:{h:p[0],py:p[1],g:p[2]}}),en:b}}
function home(){st=null;$("pop").style.display="none";
let h=`<h1>Graded Reader</h1><p class="sub">Tap any word for pinyin and meaning. Save words to review.</p><div class="row">`+
Object.keys(LEVELS).map(k=>`<button class="${k==lv?"on":""}" onclick="lv='${k}';home()">${k}</button>`).join("")+`</div>`+
LEVELS[lv].map((s,i)=>`<button class="story" onclick="open_(${i})"><b>${s.t}</b><span>${s.e} · ${s.s.length} sentences</span></button>`).join("");
$("app").innerHTML=h}
function home(){st=null;cur=null;$("pop").style.display="none";
const L=LEVELS[lv],done=L.filter(x=>PR[x.t]&&PR[x.t].best!=null).length;
let h=`<header class="top"><h1>汉语 Reader</h1><p class="sub">Graded stories with pinyin, stroke order and quizzes</p></header><div class="tabs">`+
Object.keys(LEVELS).map(k=>`<button class="${k==lv?"on":""}" onclick="lv='${k}';home()">${k}</button>`).join("")+
`</div><div class="prog"><div class="bar"><i style="width:${Math.round(done/L.length*100)}%"></i></div><span>${done} of ${L.length} quizzed</span></div>`+
L.map((x,i)=>{const p=PR[x.t]||{},n=(QZ[x.t]||[]).length;return `<button class="story" onclick="open_(${i})"><b>${x.t}</b><span>${x.e} · ${x.s.length} sentences</span><em>${p.best!=null?"Best "+p.best+"/"+n:p.read?"Read":"New"}</em></button>`}).join("")+
`<button class="cta alt" onclick="review()">Review saved words (${saved.length})</button>`;
$("app").innerHTML=h}
let qi=0,qs=0,ri=0,rf=false;
function quiz(){qi=0;qs=0;qn()}
function qn(){const Q=QZ[st.t];
if(qi>=Q.length){const p=PR[st.t]=PR[st.t]||{};p.read=1;p.best=Math.max(p.best||0,qs);sp();
$("app").innerHTML=`<button class="back" onclick="home()">← All stories</button><h1>Quiz complete</h1><div class="score">${qs}<small>/${Q.length}</small></div><p class="sub">${qs==Q.length?"Perfect score!":"Good effort. Re-read the story and try again."}</p><button class="cta" onclick="quiz()">Try again</button><button class="cta alt" onclick="render()">Back to story</button>`;return}
const q=Q[qi];
$("app").innerHTML=`<button class="back" onclick="render()">← Story</button><p class="sub">Question ${qi+1} of ${Q.length}</p><h2>${q.q}</h2>`+q.o.map((o,j)=>`<button class="opt" onclick="ans(${j},this)">${o}</button>`).join("")+`<div id="fb"></div>`}
function ans(j,b){const Q=QZ[st.t],q=Q[qi];
document.querySelectorAll(".opt").forEach((x,k)=>{x.disabled=true;if(k==q.a)x.classList.add("ok")});
if(j==q.a)qs++;else b.classList.add("no");
$("fb").innerHTML=`<button class="cta" onclick="qi++;qn()">${qi+1>=Q.length?"See score":"Next"}</button>`}
function review(){ri=0;rf=false;rc()}
function rc(){if(!saved.length){$("app").innerHTML=`<button class="back" onclick="home()">← Home</button><h1>Review</h1><p class="sub">No saved words yet. Tap a word in any story and press Save, and it will appear here.</p>`;return}
const w=saved[ri%saved.length];
$("app").innerHTML=`<button class="back" onclick="home()">← Home</button><p class="sub">Card ${ri%saved.length+1} of ${saved.length}</p><div class="fc" onclick="rf=!rf;rc()">${rf?`<div class="py2">${w.py}</div><div>${w.g}</div>`:`<div class="hz2">${w.h}</div><small>Tap to reveal</small>`}</div><button class="cta" onclick="ri++;rf=false;rc()">Next card</button>`}
function open_(i){st=LEVELS[lv][i];render()}
function render(){
let h=`<button class="back" onclick="home()">← All stories</button><h1>${st.t}</h1><p class="sub">${st.e} · ${lv}</p>
<div class="row"><button class="${py?"on":""}" onclick="py=!py;render()">Pinyin</button><button class="${tr?"on":""}" onclick="tr=!tr;render()">Translation</button><button onclick="size(-2)">A−</button><button onclick="size(2)">A+</button></div>
<div class="${py?"":"hide-py"} ${tr?"show-tr":""}">`;
st.s.forEach((l,si)=>{const o=parse(l);h+=`<div class="sent"><div class="line">`+o.tk.map((t,ti)=>t.h?`<span class="w" data-k="${si}-${ti}" onclick="pick(${si},${ti},this)"><span class="py">${t.py}</span><span class="hz">${t.h}</span></span>`:`<span class="p">${t.p}</span>`).join("")+`</div><div class="tr">${o.en}</div></div>`});
h+=`</div>${QZ[st.t]?`<button class="cta" onclick="quiz()">Take the quiz →</button>`:""}<div class="saved" id="sv"></div>`;markRead();$("app").innerHTML=h;svl()}
function pick(si,ti,el){const t=parse(st.s[si]).tk[ti];cur=t;
document.querySelectorAll(".w.sel").forEach(x=>x.classList.remove("sel"));el.classList.add("sel");
$("phz").textContent=t.h;$("ppy").textContent=t.py;$("pgl").textContent=t.g;$("pop").style.display="block";showStrokes(t.h);showInfo(t.h);
$("psave").textContent=saved.some(s=>s.h==t.h)?"Saved ✓":"+ Save"}
function closePop(){$("pop").style.display="none";$("strokes").innerHTML="";$("cinfo").innerHTML="";document.querySelectorAll(".w.sel").forEach(x=>x.classList.remove("sel"));cur=null}
$("pclose").onclick=closePop;
document.addEventListener("keydown",e=>{if(e.key==="Escape")closePop()});
$("psave").onclick=()=>{if(cur&&!saved.some(s=>s.h==cur.h)){saved.push(cur);store();$("psave").textContent="Saved ✓";svl()}};
const CH={

function showInfo(h){$("cinfo").innerHTML=[...h].filter(c=>CH[c]).map(c=>`<div><b>${c}</b> — ${CH[c]}</div>`).join("")}
function showStrokes(h){const box=$("strokes");box.innerHTML="";
if(typeof HanziWriter==="undefined"){box.innerHTML='<div class="sc">Stroke order needs an internet connection</div>';return}
const cs=getComputedStyle(document.documentElement);
[...h].filter(c=>/[\u4e00-\u9fff]/.test(c)).forEach(c=>{const d=document.createElement("div");d.className="sc";box.appendChild(d);
const w=HanziWriter.create(d,c,{width:90,height:90,padding:5,strokeAnimationSpeed:1,delayBetweenStrokes:250,
strokeColor:cs.getPropertyValue("--fg").trim()||"#000",outlineColor:cs.getPropertyValue("--bd").trim()||"#ddd",
onLoadCharDataError:()=>{d.textContent="Couldn’t load strokes for "+c}});
w.animateCharacter();d.onclick=()=>w.animateCharacter()})}
function svl(){const e=$("sv");if(!e)return;
e.innerHTML=saved.length?`<b>Saved words (${saved.length})</b>`+saved.map(s=>`<div>${s.h} · ${s.py} · ${s.g}</div>`).join("")+`<div class="row"><button onclick="exportCsv()">Export CSV</button><button onclick="clearSaved()">Clear</button></div>`:""}
function exportCsv(){const q=v=>'"'+v.replace(/"/g,'""')+'"';
const csv="\ufeff"+saved.map(s=>[s.h,s.py,s.g].map(q).join(",")).join("\n");
const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download="saved-words.csv";a.click()}
function clearSaved(){saved=[];store();svl()}
home();
</script></body></html>
